.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.aside{position:relative;overflow:hidden;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#0b3d3a,#0f766e,#14b8a6);background-size:220% 220%;animation:gm 14s ease infinite}
@keyframes gm{50%{background-position:100% 100%}}

.b1{width:320px;height:320px;top:-90px;right:-70px}.b2{width:200px;height:200px;bottom:50px;left:-60px;animation-delay:-4s}.b3{width:110px;height:110px;bottom:26%;right:18%;animation-delay:-8s;background:#f59e0b;opacity:.35}

@keyframes gr{from{transform:scaleY(0)}}@keyframes pl{50%{transform:scaleY(.8)}}
.formside{display:grid;place-items:center;padding:32px;background:var(--bg)}
.lcard{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:0 20px 50px #0f172a1a;animation:up .7s .1s both}

.fld{position:relative}.fld input{padding:11px 64px 11px 38px}.fld svg{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);stroke:var(--mute);fill:none;stroke-width:1.8}
#tg{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;color:var(--brand);padding:4px 8px;font-size:12px}
.sbtn{width:100%;margin-top:14px;padding:12px;position:relative}.sbtn.ld{color:transparent}.sbtn.ld:after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border:2px solid var(--onb);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.again .aside h1,.again .aside p,.again .aside li{animation:none;opacity:1}.again .mini i{animation:none}.lcard.shake{animation:sh .45s}
@media(max-width:860px){.auth{grid-template-columns:1fr}.aside{padding:26px 22px}.aside h1{font-size:27px;margin-top:16px}.aside ul,.mini,.aside p{display:none}}
@media(prefers-reduced-motion:reduce){.auth *{animation:none!important}.aside li{opacity:1}}
</style></head><body><div id="app"><div class="splash">Loading…</div></div>
<script>

const inr=n=>'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2}),sum=(a,k)=>a.reduce((x,y)=>x+y[k],0),uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},D=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'}),DT=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

let db,S={me:null,tab:'bill',cat:'All',cart:[],q:'',sq:'',rp:'day',err:''};

const P=[['Veg Sandwich','Sandwiches',80,[['g0',2],['g2',.08],['g4',.02]]],['Chicken Sandwich','Sandwiches',120,[['g0',2],['g3',.1],['g4',.02],['g1',1]]],['Grilled Cheese Sandwich','Sandwiches',100,[['g0',2],['g1',2]]],['Cold Coffee','Drinks',80,[['g5',15],['g6',.2]]],['Bisleri 1L','Drinks',20,[['g8',1]]],['Bisleri 500ml','Drinks',10,[['g9',1]]],['French Fries','Sides',70,[['g7',.2],['g4',.02]]]].map((a,i)=>({id:'p'+i,name:a[0],cat:a[1],price:a[2],rec:a[3]}));

for(let d=9;d>=0;d--)for(let k=0;k<3+d%3;k++){const t=new Date();t.setDate(t.getDate()-d);t.setHours(10+k*3,15,0,0);const p=P[(d+k*2)%P.length],q=1+(d+k)%3,sub=p.price*q,g=Math.round(sub*st.gst)/100;sales.push({no:'INV-'+n++,t:+t,lines:[{id:p.id,name:p.name,q,price:p.price}],sub,gst:g,total:sub+g,pay:['Cash','UPI','Card'][k%3],cust:'',by:'Ravi'})}

return{st,ing:I,prod:P,sales,pur:[],cust:[{id:'c1',name:'Aarav Shah',phone:'9820012345'}],exp:[{id:'e1',t:+mo,cat:'Rent',amt:15000,note:'Monthly rent'},{id:'e2',t:+mo,cat:'Electricity',amt:2400,note:''}],users:[{id:'u1',name:'Aradhya',user:'Aradhya',pw:'Aradhya22',role:'owner',perms:[]},{id:'u2',name:'Ravi',user:'ravi',pw:'1234',role:'worker',perms:['bill','sales','cust']}]}}
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db)db=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
function mig(){if(db.st.shop==='Sandwich Corner')db.st.shop='Food Corner';db.users.forEach(u=>{if(u.role==='owner'&&u.user==='owner'&&u.pw==='owner123'){u.name='Aradhya';u.user='Aradhya';u.pw='Aradhya22'}});db.sup=db.sup||[];db.st.logo=db.st.logo||'';db.prod.forEach((p,i)=>{if(p.code==null)p.code='890'+(100+i)})}mig();
const logoH=(st='')=>db.st.logo?`<img class="logoimg" style="${st}" src="${db.st.logo}" alt="${esc(db.st.shop)} logo">`:'';
const csv=(h,r)=>[h,...r].map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
async function dl(name,text){try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data:text});return}}catch(e){if(e&&e.code==='declined')return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text]));a.download=name;a.click()}
function xp(k){const E={sales:[['Bill','Date','Customer','Paid by','Subtotal','GST','Total'],db.sales.map(s=>[s.no,DT(s.t),s.cust||'Walk-in',s.pay,s.sub,s.gst,s.total])],exp:[['Date','Category','Note','Amount'],db.exp.map(e=>[DT(e.t),e.cat,e.note,e.amt])],pur:[['Date','Ingredient','Supplier','Qty','Cost'],db.pur.map(p=>[DT(p.t),ing(p.ing).name,p.sup,p.qty,p.cost])],cust:[['Name','Phone'],db.cust.map(c=>[c.name,c.phone])],inv:[['Ingredient','Unit','Stock','Minimum'],db.ing.map(i=>[i.name,i.unit,i.stock,i.min])]}[k];dl(k+'-'+dk(Date.now())+'.csv',csv(...E))}
const XB=k=>`<div class="bar"><button class="g" onclick="xp('${k}')">Export CSV</button></div>`;
function scan(e){if(e.key!=='Enter')return;const v=e.target.value.trim().toLowerCase();if(!v)return;const L=db.prod.filter(p=>p.code===v||p.name.toLowerCase().includes(v)),p=L.find(p=>p.code===v)||(L.length===1?L[0]:null);if(!p)return toast('No single product matches');S.q='';S.f='q';add(p.id)}
function waUrl(s,p){p=String(p).replace(/\D/g,'');if(p.length===10)p='91'+p;const t=db.st.shop+'\nBill '+s.no+' · '+DT(s.t)+'\n'+s.lines.map(l=>l.name+' × '+l.q+' = '+inr(l.q*l.price)).join('\n')+'\nGST: '+inr(s.gst)+'\nTotal: '+inr(s.total)+' ('+s.pay+')\nThank you, visit again!';return'https://wa.me/'+p+'?text='+encodeURIComponent(t)}
const wa=v=>{$('#wa').href=waUrl(S.inv,v)};
function setLogo(i){const f=i.files[0];if(!f)return;if(f.size>2e5)return toast('Logo must be under 200 KB');const r=new FileReader();r.onload=()=>{db.st.logo=r.result;save();render()};r.readAsDataURL(f)}
const rmLogo=()=>{db.st.logo='';save();render()};
function restore(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.st||!d.prod||!d.ing)throw 0;db=d;mig();save();toast('Backup restored');logout()}catch(e){toast('Not a valid backup file')}};r.readAsText(f)}
function addSup(){if(!V('sn').trim())return toast('Enter supplier name');db.sup.push({id:uid('s'),name:V('sn').trim(),phone:V('sp').trim(),item:V('si').trim()});save();render()}
const supv=()=>`<h2>Suppliers</h2><div class="card">${T(['Supplier','Phone','Supplies','Total purchased',''],db.sup.map(s=>[esc(s.name),esc(s.phone||'–'),esc(s.item||'–'),inr(sum(db.pur.filter(p=>p.sup===s.name),'cost')),`<button class="d" onclick="db.sup=db.sup.filter(x=>x.id!=='${s.id}');save();render()">Remove</button>`]))}<div class="fm">${F('sn','Supplier name')}${F('sp','Phone','tel')}${F('si','What they supply')}<button onclick="addSup()">Add supplier</button></div></div>`;
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const own=()=>S.me.role==='owner',can=k=>own()||S.me.perms.includes(k),ing=i=>db.ing.find(x=>x.id===i)||{stock:0,name:'?',unit:''},prod=i=>db.prod.find(x=>x.id===i);
const lows=()=>db.ing.filter(i=>i.stock<=i.min),pays=()=>db.st.pay.split(',').map(s=>s.trim()).filter(Boolean);

function checkout(){if(!S.cart.length)return;const T=tot(),c=db.cust.find(x=>x.id===V('cs'));const lines=S.cart.map(l=>{const p=prod(l.id);p.rec.forEach(r=>{const i=ing(r[0]);i.stock=Math.round((i.stock-r[1]*l.q)*1000)/1000});return{id:p.id,name:p.name,q:l.q,price:p.price}});
const s={no:db.st.prefix+'-'+db.st.next++,t:Date.now(),lines,sub:T.sub,gst:T.g,total:T.t,pay:V('pm'),cust:c?c.name:'',cid:c?c.id:'',ph:c?c.phone:'',by:S.me.name};db.sales.push(s);save();S.cart=[];S.inv=s;render()}
function bill(){const L=db.prod.filter(p=>(S.cat==='All'||p.cat===S.cat)&&p.name.toLowerCase().includes(S.q.toLowerCase())),T=tot();
return`<h2>Billing / POS</h2><div class="pos"><div class="card"><input id="q" placeholder="Search, or scan a barcode and press Enter" value="${esc(S.q)}" oninput="S.q=this.value;S.f='q';render()" onkeydown="scan(event)"><div class="chips">${['All',...new Set(db.prod.map(p=>p.cat))].map(c=>`<button class="${S.cat===c?'on':''}" onclick="S.cat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div><div class="grid">${L.map(p=>`<button class="item" ${avail(p,1)?'':'disabled'} onclick="add('${p.id}')"><b>${esc(p.name)}</b><span>${avail(p,1)?esc(p.cat):'Out of stock'}</span><em>${inr(p.price)}</em></button>`).join('')||'<p class="hint">No products found.</p>'}</div></div>
<div class="card"><b>Current order</b>${S.cart.map(c=>{const p=prod(c.id);return`<div class="ln"><span class="n">${esc(p.name)}<br><small class="hint">${inr(p.price)} each</small></span><span class="q"><button onclick="qty('${c.id}',-1)" aria-label="Less">−</button>${c.q}<button onclick="qty('${c.id}',1)" aria-label="More">+</button></span><b>${inr(c.q*p.price)}</b></div>`}).join('')||'<p class="hint">Tap a product to start an order.</p>'}
<div style="margin-top:10px"><div class="r"><span>Subtotal</span><span>${inr(T.sub)}</span></div><div class="r"><span>GST (${db.st.gst}%)</span><span>${inr(T.g)}</span></div><div class="r t"><span>Total</span><span>${inr(T.t)}</span></div></div>
${SEL('cs','Customer (optional)',[['','Walk-in'],...db.cust.map(c=>[c.id,c.name])])}${SEL('pm','Payment',pays().map(p=>[p,p]))}<div style="display:flex;gap:8px;margin-top:12px"><button style="flex:1" ${S.cart.length?'':'disabled'} onclick="checkout()">Complete & generate bill</button><button class="g" ${S.cart.length?'':'disabled'} onclick="S.cart=[];render()">Clear</button></div></div></div>`}
function invoice(s){return`<div class="modal"><div class="card"><div style="text-align:center">${logoH('margin:0 auto 6px')}<b style="font-size:18px">${esc(db.st.shop)}</b><br><small>${esc(db.st.addr)}<br>GSTIN: ${esc(db.st.gstin)}</small></div><hr style="border:0;border-top:1px dashed var(--line)"><small>Bill ${s.no} · ${DT(s.t)}<br>Customer: ${esc(s.cust||'Walk-in')} · Cashier: ${esc(s.by)}</small>${s.lines.map(l=>`<div class="ln"><span class="n">${esc(l.name)} × ${l.q}</span><b>${inr(l.q*l.price)}</b></div>`).join('')}
<div class="r"><span>Subtotal</span><span>${inr(s.sub)}</span></div><div class="r"><span>CGST</span><span>${inr(s.gst/2)}</span></div><div class="r"><span>SGST</span><span>${inr(s.gst/2)}</span></div><div class="r t"><span>Total</span><span>${inr(s.total)}</span></div><small>Paid by ${s.pay}. Thank you, visit again!</small><div class="np"><label for="wp">Send on WhatsApp (mobile number)</label><div style="display:flex;gap:8px"><input id="wp" inputmode="tel" value="${esc(s.ph||'')}" placeholder="10-digit number" oninput="wa(this.value)"><a id="wa" class="btn" target="_blank" rel="noopener" href="${waUrl(s,s.ph||'')}">Send</a></div></div>
<div class="np" style="display:flex;gap:8px;margin-top:12px"><button style="flex:1" onclick="print()">Print invoice</button><button class="g" onclick="S.inv=null;render()">Close</button></div></div></div>`}
/* Screens */
function dash(){const k=dk(Date.now()),ts=db.sales.filter(s=>dk(s.t)===k),te=db.exp.filter(e=>dk(e.t)===k),lw=lows(),days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return[D(d),sum(db.sales.filter(s=>dk(s.t)===dk(d)),'total')]});
return`<h2>Dashboard</h2>${lw.length?`<div class="banner">⚠ Restock needed: ${lw.map(i=>esc(i.name)).join(', ')}</div>`:''}<div class="stats">${stat("Today's sales",inr(sum(ts,'total')))+stat('Orders today',ts.length)+stat('Expenses today',inr(sum(te,'amt')))+stat('Low-stock items',lw.length,lw.length?'low':'')}</div><div class="two"><div class="card"><b>Sales, last 7 days</b>${bars(days)}</div><div class="card"><b>Low-stock alerts</b>${T(['Ingredient','Left','Minimum'],lw.map(i=>[esc(i.name),`<span class="low">${i.stock} ${i.unit}</span>`,i.min+' '+i.unit]))}</div></div><div class="card"><b>Recent bills</b>${bt(db.sales.slice(-5).reverse())}</div>`}
const str=r=>r.map(x=>ing(x[0]).name+'='+x[1]).join(', ');
function addProd(){const n=V('pn').trim(),rec=[];if(!n||!N('pp'))return toast('Enter a name and price');for(const part of V('pr').split(',').filter(x=>x.trim())){const[a,b]=part.split('=');const i=db.ing.find(x=>x.name.toLowerCase()===(a||'').trim().toLowerCase());if(!i||!+b)return toast('Recipe: use Ingredient name=qty, with names from Inventory');rec.push([i.id,+b])}db.prod.push({id:uid('p'),name:n,cat:V('pc'),price:N('pp'),code:V('pb').trim(),rec});save();render()}
const prodv=()=>`<h2>Products</h2><div class="card">${T(['Product','Barcode','Category','Price (₹)','Recipe (used per item)',''],db.prod.map(p=>[esc(p.name),`<input value="${esc(p.code)}" onchange="prod('${p.id}').code=this.value.trim();save();toast('Saved')">`,esc(p.cat),`<input type="number" min="0" value="${p.price}" onchange="prod('${p.id}').price=+this.value;save();toast('Saved')">`,esc(str(p.rec))||'–',`<button class="d" onclick="if(confirm('Remove product?')){db.prod=db.prod.filter(x=>x.id!=='${p.id}');S.cart=[];save();render()}">Remove</button>`]))}
<div class="fm">${F('pn','Name')}${SEL('pc','Category',['Sandwiches','Drinks','Sides','Other'].map(x=>[x,x]))}${F('pp','Price (₹)','number')}${F('pb','Barcode (optional)')}${F('pr','Recipe e.g. Bread slices=2, Chicken=0.1')}<button onclick="addProd()">Add product</button></div></div>`;
const upI=(id,k,v)=>{ing(id)[k]=+v||0;save();toast('Saved')};
function addIng(){if(!V('in').trim())return toast('Enter a name');db.ing.push({id:uid('g'),name:V('in').trim(),unit:V('iu').trim()||'pcs',stock:N('is'),min:N('im')});save();render()}
function delIng(id){if(db.prod.some(p=>p.rec.some(r=>r[0]===id)))return toast('Used in a product recipe; remove that first');if(confirm('Remove ingredient?')){db.ing=db.ing.filter(i=>i.id!==id);save();render()}}
const invv=()=>`<h2>Inventory</h2><div class="card">${XB('inv')}${T(['Ingredient','Unit','In stock','Minimum','Status',''],db.ing.map(i=>[esc(i.name),esc(i.unit),`<input type="number" min="0" step="any" value="${i.stock}" onchange="upI('${i.id}','stock',this.value)">`,`<input type="number" min="0" step="any" value="${i.min}" onchange="upI('${i.id}','min',this.value)">`,i.stock<=i.min?'<span class="low">Restock</span>':'OK',`<button class="d" onclick="delIng('${i.id}')">Remove</button>`]))}<p class="hint">Stock reduces automatically when a product is sold, based on its recipe.</p>
<div class="fm">${F('in','Ingredient')}${F('iu','Unit (kg, pcs, L)')}${F('is','Opening stock','number')}${F('im','Minimum','number')}<button onclick="addIng()">Add ingredient</button></div></div>`;
function addPur(){if(!N('pq')||!N('pcst'))return toast('Enter quantity and cost');const i=ing(V('pi'));i.stock=Math.round((i.stock+N('pq'))*1000)/1000;db.pur.push({id:uid('r'),t:Date.now(),ing:i.id,sup:V('ps').trim()||'–',qty:N('pq'),cost:N('pcst')});save();render();toast('Stock updated')}
const purv=()=>`<h2>Purchases</h2><div class="card"><b>Record new stock</b><div class="fm">${SEL('pi','Ingredient',db.ing.map(i=>[i.id,i.name+' ('+i.unit+')']))}${SEL('ps','Supplier',db.sup.length?db.sup.map(x=>[x.name,x.name]):[['–','No suppliers yet (add in Suppliers)']])}${F('pq','Quantity','number')}${F('pcst','Total cost (₹)','number')}<button onclick="addPur()">Add purchase</button></div></div><div class="card"><b>Purchase history</b>${XB('pur')}${T(['Date','Ingredient','Supplier','Qty','Cost'],db.pur.slice().reverse().map(p=>[DT(p.t),esc(ing(p.ing).name),esc(p.sup),p.qty+' '+ing(p.ing).unit,inr(p.cost)]))}</div>`;
const salesv=()=>{const q=S.sq.toLowerCase();return`<h2>Sales & Bills</h2><div class="card">${XB('sales')}<input id="sq" placeholder="Search bill no. or customer" value="${esc(S.sq)}" oninput="S.sq=this.value;S.f='sq';render()"><br><br>${bt(db.sales.filter(s=>(s.no+s.cust).toLowerCase().includes(q)).reverse().slice(0,60))}</div>`};
function addCust(){if(!V('cn').trim())return toast('Enter a name');db.cust.push({id:uid('c'),name:V('cn').trim(),phone:V('cp').trim()});save();render()}
const custv=()=>`<h2>Customers</h2><div class="card">${XB('cust')}${T(['Name','Phone','Orders','Total spent',''],db.cust.map(c=>{const s=db.sales.filter(x=>x.cid===c.id);return[esc(c.name),esc(c.phone||'–'),s.length,inr(sum(s,'total')),`<button class="d" onclick="db.cust=db.cust.filter(x=>x.id!=='${c.id}');save();render()">Remove</button>`]}))}<div class="fm">${F('cn','Name')}${F('cp','Phone','tel')}<button onclick="addCust()">Add customer</button></div></div>`;
function addExp(){if(!N('ea'))return toast('Enter an amount');db.exp.push({id:uid('e'),t:Date.now(),cat:V('ec'),amt:N('ea'),note:V('en').trim()});save();render()}
const expv=()=>`<h2>Expenses</h2><div class="card"><div class="fm">${SEL('ec','Category',['Rent','Electricity','Supplies','Salary','Other'].map(x=>[x,x]))}${F('ea','Amount (₹)','number')}${F('en','Note')}<button onclick="addExp()">Add expense</button></div></div><div class="card">${XB('exp')}${T(['Date','Category','Note','Amount',''],db.exp.slice().reverse().map(e=>[DT(e.t),e.cat,esc(e.note||'–'),inr(e.amt),`<button class="d" onclick="db.exp=db.exp.filter(x=>x.id!=='${e.id}');save();render()">Remove</button>`]))}</div>`;
function repv(){const m=S.rp==='mon',key=t=>m?dk(t).slice(0,7):dk(t),keys=[...new Set([...db.sales,...db.exp,...db.pur].map(x=>key(x.t)))].sort().reverse().slice(0,m?12:14);
const rows=keys.map(k=>{const s=db.sales.filter(x=>key(x.t)===k),e=sum(db.exp.filter(x=>key(x.t)===k),'amt'),p=sum(db.pur.filter(x=>key(x.t)===k),'cost'),sb=sum(s,'sub');return{k,o:s.length,sb,g:sum(s,'gst'),e,p,n:sb-e-p}});
return`<h2>Reports</h2><div class="chips"><button class="${m?'':'on'}" onclick="S.rp='day';render()">Daily</button><button class="${m?'on':''}" onclick="S.rp='mon';render()">Monthly</button></div><div class="stats">${stat('Sales (excl. GST)',inr(sum(rows,'sb')))+stat('GST collected',inr(sum(rows,'g')))+stat('Expenses + purchases',inr(sum(rows,'e')+sum(rows,'p')))+stat('Net profit',inr(sum(rows,'n')),sum(rows,'n')<0?'low':'')}</div>
<div class="card"><b>Sales trend</b>${bars(rows.slice().reverse().map(r=>[r.k.slice(m?2:5),r.sb]))}</div><div class="card">${T(['Period','Orders','Sales','GST','Expenses','Purchases','Net'],rows.map(r=>[r.k,r.o,inr(r.sb),inr(r.g),inr(r.e),inr(r.p),`<b class="${r.n<0?'low':''}">${inr(r.n)}</b>`]))}<p class="hint">Net = sales excluding GST − expenses − stock purchases.</p></div>`}
function addUser(){const u=V('uu').trim();if(!V('un2').trim()||!u||!V('up'))return toast('Fill in all fields');if(db.users.some(x=>x.user===u))return toast('Username taken');db.users.push({id:uid('u'),name:V('un2').trim(),user:u,pw:V('up'),role:V('ur'),perms:['bill']});save();render()}
function perm(id,k,on){const u=db.users.find(x=>x.id===id);u.perms=on?[...u.perms,k]:u.perms.filter(x=>x!==k);save()}
const usersv=()=>`<h2>Users & Permissions</h2><div class="card">${T(['Name','Username','Role','Access (workers)',''],db.users.map(u=>[esc(u.name),esc(u.user),u.role,u.role==='owner'?'Full access':M.map(m=>`<label style="display:inline-flex;gap:3px;margin:0 8px 0 0;color:var(--ink)"><input type="checkbox" ${u.perms.includes(m[0])?'checked':''} onchange="perm('${u.id}','${m[0]}',this.checked)">${m[1]}</label>`).join(''),u.id===S.me.id?'':`<button class="d" onclick="if(confirm('Remove user?')){db.users=db.users.filter(x=>x.id!=='${u.id}');save();render()}">Remove</button>`]))}
<div class="fm">${F('un2','Full name')}${F('uu','Username')}${F('up','Password','password')}${SEL('ur','Role',[['worker','Worker'],['owner','Owner']])}<button onclick="addUser()">Add user</button></div></div>`;
function saveSet(){Object.assign(db.st,{shop:V('s1').trim(),addr:V('s2').trim(),gstin:V('s3').trim(),gst:N('s4'),prefix:V('s5').trim()||'INV',next:N('s6')||1,pay:V('s7')});save();toast('Settings saved')}
const setv=()=>`<h2>Settings</h2><div class="card"><div class="fm">${F('s1','Shop name','text',db.st.shop)}${F('s2','Address','text',db.st.addr)}${F('s3','GSTIN','text',db.st.gstin)}${F('s4','GST rate (%)','number',db.st.gst)}${F('s5','Bill prefix','text',db.st.prefix)}${F('s6','Next bill number','number',db.st.next)}${F('s7','Payment methods (comma separated)','text',db.st.pay)}<button onclick="saveSet()">Save settings</button></div></div><div class="card"><b>Shop logo</b><p class="hint">PNG or JPG under 200 KB. Shown in the sidebar and on invoices.</p><input type="file" accept="image/*" onchange="setLogo(this)">${db.st.logo?'<br><br><button class="d" onclick="rmLogo()">Remove logo</button>':''}</div><div class="card"><b>Backup & restore</b><p class="hint">Data is stored in this browser. Download a backup regularly and restore it on another device.</p><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button onclick="dl('shopledger-backup-'+dk(Date.now())+'.json',JSON.stringify(db))">Download backup</button><input type="file" accept=".json" onchange="restore(this)" style="width:auto"></div></div>`;
const V2={dash,bill,prod:prodv,inv:invv,pur:purv,sup:supv,sales:salesv,cust:custv,exp:expv,rep:repv,users:usersv,set:setv};
function render(){const a=$('#app');if(!S.me){const e=S.err?' again':'';a.innerHTML=`<div class="auth${e}"><div class="aside"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="brand">${logoH()}<div class="logo">${esc(db.st.shop)}</div></div><h1>Stock and billing,<br>in one place.</h1><p>Run your counter faster and always know what is in stock.</p><ul><li style="--d:.5s">Quick bills with GST and printable invoices</li><li style="--d:.7s">Ingredients deducted automatically on every sale</li><li style="--d:.9s">Owner dashboard and staff permissions</li></ul><div class="mini"><i style="--h:35%;--dl:.2s"></i><i style="--h:55%;--dl:.35s"></i><i style="--h:42%;--dl:.5s"></i><i style="--h:80%;--dl:.65s"></i><i style="--h:62%;--dl:.8s"></i><i style="--h:100%;--dl:.95s"></i></div></div>
<div class="formside"><div class="lcard${S.err?' shake':''}"><h2>Welcome back</h2><div class="sub">Sign in to continue to ${esc(db.st.shop)}</div>
<label for="un">Username</label><div class="fld"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><input id="un" autocomplete="username" value="${esc(S.un||'')}"></div>
<label for="pw">Password</label><div class="fld"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="pw" type="password" autocomplete="current-password" onkeydown="caps(event);if(event.key==='Enter')signIn()" onkeyup="caps(event)"><button id="tg" type="button" onclick="tp()" aria-label="Show or hide password">Show</button></div>
<div id="cl" class="hint" style="display:none;color:var(--bad)">Caps Lock is on</div><div class="err" role="alert">${S.err}</div><button id="sb" class="sbtn" onclick="signIn()">Sign in</button><p class="hint" style="text-align:center;margin-top:16px">Secure staff login · Owner and worker access</p></div></div></div>`;setTimeout(()=>{const f=$(S.un?'#pw':'#un');f&&f.focus()},60);return}
const tabs=[...M.filter(m=>can(m[0])),...(own()?[['users','Users'],['set','Settings']]:[])];if(!tabs.some(t=>t[0]===S.tab))S.tab=tabs[0][0];
a.innerHTML=`<div class="shell"><aside>${logoH()}<div class="logo">${esc(db.st.shop)}</div>${tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')}<button onclick="logout()">Sign out</button><div class="who">${esc(S.me.name)} · ${S.me.role}</div></aside><main>${V2[S.tab]()}</main></div>${S.inv?invoice(S.inv):''}`;
if(S.f){const e=$('#'+S.f);if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}S.f=null}}
setTimeout(render,250);
</script></body></html>
